      - name: Diagnose and export Android APK
        shell: bash
        run: |
          mkdir -p build
          set +e

          echo "=== Java ==="
          java -version

          echo "=== Android SDK ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/build-tools" || true
          ls -la "$ANDROID_HOME/platforms" || true

          echo "=== Godot export templates ==="
          ls -la "$HOME/.local/share/godot/export_templates/4.4.1.stable/" || true

          echo "=== Export presets ==="
          cat export_presets.cfg

          echo "=== Godot Android export diagnostics ==="
          godot --headless --verbose \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/AI-Game.apk" \
            2>&1 | tee export.log

          result=${PIPESTATUS[0]}
          echo "Godot export exit code: $result"
          exit "$result"
