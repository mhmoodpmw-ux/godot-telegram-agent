name: Build Android APK with Godot

on:
  workflow_dispatch:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: godot-android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Export Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Download Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"

          wget -q --show-progress \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" \
            -O godot.zip

          unzip -oq godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64

          sudo mv Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot

          godot --version

      - name: Install Godot export templates
        shell: bash
        run: |
          set -euo pipefail

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$RUNNER_TEMP/godot-templates"
          mkdir -p "$TEMPLATE_DIR"

          wget -q --show-progress \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" \
            -O "$RUNNER_TEMP/templates.tpz"

          unzip -oq "$RUNNER_TEMP/templates.tpz" \
            -d "$RUNNER_TEMP/godot-templates"

          if [ -d "$RUNNER_TEMP/godot-templates/templates" ]; then
            cp -a "$RUNNER_TEMP/godot-templates/templates/." "$TEMPLATE_DIR/"
          else
            echo "ERROR: Godot templates folder was not found."
            find "$RUNNER_TEMP/godot-templates" -maxdepth 3 -type f
            exit 1
          fi

          echo "Installed export templates:"
          ls -lah "$TEMPLATE_DIR"

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Project directory ==="
          pwd
          ls -lah

          if [ ! -f project.godot ]; then
            echo "ERROR: project.godot was not found at repository root."
            echo "Searching for project.godot:"
            find . -name project.godot -not -path './.git/*'
            exit 1
          fi

          if [ ! -f export_presets.cfg ]; then
            echo "ERROR: export_presets.cfg is missing."
            exit 1
          fi

          echo "=== Export presets ==="
          cat export_presets.cfg

          echo "=== Java ==="
          java -version

          echo "=== Android SDK ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Configure Godot Android SDK path
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

          echo "Java path: $JAVA_HOME"
          echo "Android SDK path: $ANDROID_HOME"

      - name: Import Godot project
        shell: bash
        run: |
          set -o pipefail

          godot --headless --editor \
            --path "$GITHUB_WORKSPACE" \
            --import 2>&1 | tee import.log

      - name: Validate Android export preset
        shell: bash
        run: |
          set -euo pipefail

          godot --headless --path "$GITHUB_WORKSPACE" \
            --editor --quit \
            2>&1 | tee editor-check.log

          echo "=== Available presets ==="
          godot --headless --path "$GITHUB_WORKSPACE" \
            --editor --quit \
            --verbose 2>&1 | tee preset-check.log || true

      - name: Export Android APK
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p build

          godot --headless --verbose \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/AI-Game.apk" \
            2>&1 | tee export.log

          result=${PIPESTATUS[0]}
          echo "Godot export exit code: $result"

          if [ "$result" -ne 0 ]; then
            echo "ERROR: Godot could not export the Android APK."
            exit "$result"
          fi

          if [ ! -s build/AI-Game.apk ]; then
            echo "ERROR: APK was not created or is empty."
            exit 1
          fi

          echo "=== APK information ==="
          ls -lh build/AI-Game.apk
          file build/AI-Game.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Game-Android-APK
          path: build/AI-Game.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Godot-Android-Build-Logs
          path: |
            import.log
            editor-check.log
            preset-check.log
            export.log
          if-no-files-found: ignore
          retention-days: 7
