name: Build Godot Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          sudo mv Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O templates.tpz
          unzip -q templates.tpz -d templates
          cp -r templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Validate Godot project
        run: |
          test -f project.godot
          test -f Main.tscn
          test -f Main.gd
          test -f export_presets.cfg
          godot --version
          godot --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Export Android APK
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          godot --headless --verbose --path "$GITHUB_WORKSPACE" --export-debug "Android" "$GITHUB_WORKSPACE/build/AI-Game.apk" 2>&1 | tee export.log

      - name: Upload export log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Godot-Export-Log
          path: export.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify APK
        run: |
          test -s build/AI-Game.apk
          ls -lh build/AI-Game.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Game-APK
          path: build/AI-Game.apk
          if-no-files-found: error
          retention-days: 7
