name: Godot Project Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          sudo mv Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot

      - name: Check project files
        run: |
          test -f project.godot
          test -f Main.tscn
          test -f Main.gd

      - name: Validate Godot project
        run: |
          godot --version
          godot --headless --editor --path "$GITHUB_WORKSPACE" --quit
          godot --headless --path "$GITHUB_WORKSPACE" --quit
