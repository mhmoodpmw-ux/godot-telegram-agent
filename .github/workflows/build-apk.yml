
name: Godot Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking for a Godot project..."
          if [ ! -f project.godot ]; then
            echo "::error::project.godot not found in repository root"
            exit 1
          fi

      - name: Build APK
        run: |
          echo "Project found. Godot and Android export setup are required."
          echo "This workflow intentionally stops before export until the project is configured."
          exit 1
