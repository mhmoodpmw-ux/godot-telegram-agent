name: Build Android APK with Godot

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Export Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e
          echo "=== Java ==="
          java -version
          echo "=== Android SDK ==="
          echo "$ANDROID_HOME"
          sdkmanager --list_installed
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Install Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"

          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" \
            -O godot.zip

          unzip -oq godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          sudo mv Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot

          godot --version

      - name: Install Godot export templates
        shell: bash
        run: |
          set -euo pipefail

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$TEMPLATE_DIR"

          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" \
            -O "$RUNNER_TEMP/templates.tpz"

          mkdir -p "$RUNNER_TEMP/templates"
          unzip -oq "$RUNNER_TEMP/templates.tpz" \
            -d "$RUNNER_TEMP/templates"

          if [ -d "$RUNNER_TEMP/templates/templates" ]; then
            cp -a "$RUNNER_TEMP/templates/templates/." "$TEMPLATE_DIR/"
          else
            echo "ERROR: Export templates directory not found."
            find "$RUNNER_TEMP/templates" -maxdepth 3 -type f
            exit 1
          fi

          ls -lah "$TEMPLATE_DIR"

      - name: Check project configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f project.godot ]; then
            echo "ERROR: project.godot is missing from repository root."
            find . -name project.godot -not -path './.git/*'
            exit 1
          fi

          if [ ! -f export_presets.cfg ]; then
            echo "ERROR: export_presets.cfg is missing."
            exit 1
          fi

          echo "=== Export presets ==="
          cat export_presets.cfg

      - name: Import Godot project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path "$GITHUB_WORKSPACE" --import \
            2>&1 | tee import.log

      - name: Export Android APK
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build

          godot --headless --verbose \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/AI-Game.apk" \
            2>&1 | tee export.log

          result=${PIPESTATUS[0]}
          echo "Godot export exit code: $result"

          if [ "$result" -ne 0 ]; then
            echo "APK export failed. See export.log."
            exit "$result"
          fi

          if [ ! -s build/AI-Game.apk ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          ls -lh build/AI-Game.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Game-Android-APK
          path: build/AI-Game.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Godot-Android-Build-Logs
          path: |
            import.log
            export.log
          if-no-files-found: ignore
          retention-days: 7
