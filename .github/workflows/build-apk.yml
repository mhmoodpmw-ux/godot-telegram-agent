name: Build Godot Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Download Godot 4.4.1
        shell: bash
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip \
            -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          sudo mv Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install Godot export templates
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz \
            -O templates.tpz
          mkdir templates
          unzip -q templates.tpz -d templates
          cp -r templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"

      - name: Configure Android SDK and Java
        shell: bash
        run: |
          test -d "$ANDROID_HOME"
          test -d "$JAVA_HOME"

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Validate project files
        shell: bash
        run: |
          test -f project.godot
          test -f Main.tscn
          test -f Main.gd
          test -f export_presets.cfg
          grep -q 'name="Android"' export_presets.cfg
          grep -q 'platform="Android"' export_presets.cfg

      - name: Import project
        shell: bash
        run: |
          godot --headless --editor \
            --path "$GITHUB_WORKSPACE" \
            --import

      - name: Check project
        shell: bash
        run: |
          godot --headless \
            --path "$GITHUB_WORKSPACE" \
            --quit

      - name: Export Android APK
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          godot --headless --verbose \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/AI-Game.apk" \
            2>&1 | tee export.log

      - name: Verify APK
        shell: bash
        run: |
          test -s build/AI-Game.apk
          ls -lh build/AI-Game.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Game-APK
          path: build/AI-Game.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Godot-Build-Logs
          path: |
            export.log
          if-no-files-found: ignore
          retention-days: 7
